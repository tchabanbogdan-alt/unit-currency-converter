<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конвертер валют і одиниць</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <!-- Vue 3, глобальна збірка з CDN: без Node.js і без збірки проєкту -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>Конвертер валют і одиниць</h1>
  </header>

  <!-- Кореневий елемент Vue-застосунку -->
  <main id="app">

    <section id="type" class="panel">
      <h2>Вибір типу конвертації</h2>
      <fieldset>
        <legend>Тип величини</legend>

        <div class="type-options">
          <div class="radio-option" v-for="type in conversionTypes" :key="type.value">
            <input type="radio" :id="'type-' + type.value" name="conversion-type"
                   :value="type.value" v-model="conversionType">
            <label :for="'type-' + type.value">{{ type.label }}</label>
          </div>
        </div>
      </fieldset>
    </section>

    <section id="converter" class="panel">
      <h2>Форма конвертації</h2>
      <converter-form :rates="rates" :units="units" @save="addToHistory"></converter-form>
    </section>

    <section id="history" class="panel">
      <h2>Історія конвертацій</h2>
      <history-list :items="history"></history-list>
    </section>

    <section id="rates" class="panel">
      <h2>Курси валют</h2>

      <p v-if="loading" id="rates-status">Завантаження курсів…</p>
      <p v-if="errorMessage" id="rates-error">{{ errorMessage }}</p>

      <rates-list :rates="rates" :date="ratesDate"></rates-list>

      <button type="button" class="btn-secondary" @click="loadRates" :disabled="loading">
        Оновити курси
      </button>
    </section>

  </main>

  <footer>
    <p>Курси валют і коефіцієнти переведення наведено орієнтовно. Навчальний проєкт, 2026.</p>
  </footer>

</body>
</html>
